<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Google Material Symbol Outline -->
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
    <div class="app-container">
        <!-- 1. TOP NAVBAR  -->
         <header class="navbar">
            <div class="nav-logo">
                <h2>Hire<span>Hub</span></h2>
            </div>

            <nav class="nav-links">
                <a href="#" class="active">Explore Jobs</a>
                <a href="#">Internships</a>
                <a href="#">Top Companies</a>
            </nav>

            <div class="nav-actions">
                <button class="btn-secondary">Saved Jobs</button>
                <button class="btn-primary">Sign In</button>
            </div>
         </header>
        
         <!-- 2. HERO SEARCH SECTION -->
          <section class="hero-section">
            <div class="hero-content">
                <h1>Find Your Next Opportunity</h1>
                <p>Search through thousands of aggregated jobs and internships</p>

                <!-- Search Box -->
                 <div class="search-bar">
                    <div class="search-input">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
                        </svg>

                        <input type="text" placeholder="Job Title, Skills ...">
                    </div>
                    <div class="search-divider"></div>
                    <div class="search-input">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M536.5-503.5Q560-527 560-560t-23.5-56.5Q513-640 480-640t-56.5 23.5Q400-593 400-560t23.5 56.5Q447-480 480-480t56.5-23.5ZM480-186q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm0 106Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 100-79.5 217.5T480-80Zm0-480Z"/>
                        </svg>
                        <input type="text" placeholder="Location (City, Remote)">
                    </div>
                    <button class="btn-search">Search Jobs</button>
                 </div>

                 <!-- QUICK TAGS -->
                  <div class="popular-tags">
                    <span>Popular:</span>
                    <button class="tag">Remote</button>
                    <button class="tag">Frontend</button>
                    <button class="tag">Internships</button>
                    <button class="tag">10LPA+</button>
                  </div>
            </div>
          </section>

          <!-- MAIN DASHBOARD AREA -->
           <div class="main-dashboard">

            <!-- Filter Slide bar (25% width) -->
            <aside class="filter-sidebar">
                <div class="filter-header">
                    <h3>Filter</h3>
                    <button class="btn-reset">Clear All</button>
                </div>

                <!-- JOB TYPE FILTER -->
                 <div class="filter-group">
                    <h4>Job Type</h4>
                    <label><input type="checkbox">Full-time</label>
                    <label><input type="checkbox">Intership</label>
                    <label><input type="checkbox">Part-time</label>
                    <label><input type="checkbox">Contract</label>
                 </div>

                 <!-- WORK MODE FILTER -->
                  <div class="filter-group">
                    <h4>Work Mode</h4>
                    <label><input type="checkbox">Remote</label>
                    <label><input type="checkbox">Hybrid</label>
                    <label><input type="checkbox">On-site</label>
                  </div>

                  <!-- SALARY / STIPEND FILTER -->
                   <div class="filter-group">
                    <h4>Min Salary / Stipend</h4>
                    <input type="range" min="0" max="50" value="10">
                    <div class="range-labels">
                        <span>₹0</span>
                        <span>₹50LPA+</span>
                    </div>
                   </div>

                   <!-- SOURCE PLATFORM FILTER -->
                    <div class="filter-group">
                        <h4>Source Platform</h4>
                        <label><input type="checkbox" checked>LinkedIn</label>
                        <label><input type="checkbox" checked>Indeed</label>
                        <label><input type="checkbox" checked>Unstop</label>
                        <label><input type="checkbox" checked>Glassdoor</label>
                    </div>
            </aside>
           </div>
    </div>
    
</body>
</html>
